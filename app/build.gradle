apply plugin: 'com.android.application'
apply plugin: "androidx.navigation.safeargs"
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }
def secret = { String name -> "\"${localProps.getProperty(name, '')}\"" }

android {
    compileSdkVersion 29
    buildToolsVersion = '29.0.0'
    defaultConfig {
        applicationId "com.batache.songs"
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled = true

        // API keys come from local.properties (gitignored). See README, "API keys".
        buildConfigField "String", "YOUTUBE_API_KEY", secret('songs.youtubeApiKey')
        buildConfigField "String", "YOUTUBE_API_KEY_2", secret('songs.youtubeApiKey2')
        buildConfigField "String", "LASTFM_API_KEY", secret('songs.lastfmApiKey')
        buildConfigField "String", "CSE_API_KEY", secret('songs.cseApiKey')
        buildConfigField "String", "CSE_DNDNHA_CX", secret('songs.cseDndnhaCx')
        buildConfigField "String", "CSE_GENIUS_CX", secret('songs.cseGeniusCx')
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in close builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
}

ext {
    supportLibVersion = '28.0.0'
    roomVersion = '2.2.5'
    archLifecycleVersion = '2.2.0'
    navVersion = "2.3.0"
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0-alpha03'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.media:media:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.1'
    implementation "androidx.preference:preference:1.1.1"

    implementation 'com.airbnb.android:epoxy:3.8.0'
    kapt 'com.airbnb.android:epoxy-processor:3.8.0'

    implementation 'com.miguelcatalan:materialsearchview:1.4.0'
    implementation 'com.github.HaarigerHarald:android-youtubeExtractor:master-SNAPSHOT'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.github.kabouzeid:AndroidSlidingUpPanel:3.3.3-kmod'
    implementation 'com.facebook.fresco:fresco:2.1.0'
    implementation 'com.mindorks.android:prdownloader:0.4.0'
    implementation 'me.zhanghai.android.materialprogressbar:library:1.6.1'
    implementation 'org.jsoup:jsoup:1.13.1'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.10.5'
    implementation 'com.google.android.exoplayer:exoplayer-smoothstreaming:2.10.5'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.10.5'
    implementation 'com.google.android.exoplayer:extension-mediasession:2.10.5'
    implementation 'com.squareup.retrofit2:retrofit:2.6.1'
    implementation 'com.squareup.retrofit2:converter-gson:2.6.1'
    implementation 'com.squareup.retrofit2:converter-simplexml:2.5.0'

    // Room components
    implementation "androidx.room:room-runtime:$roomVersion"
    kapt "androidx.room:room-compiler:$roomVersion"
    androidTestImplementation "androidx.room:room-testing:$roomVersion"

    // Lifecycle components
    implementation "androidx.lifecycle:lifecycle-extensions:$archLifecycleVersion"
    kapt "androidx.lifecycle:lifecycle-compiler:$archLifecycleVersion"

    implementation "androidx.navigation:navigation-fragment:$navVersion"
    // For Kotlin use navigation-fragment-ktx
    implementation "androidx.navigation:navigation-ui:$navVersion"
    // For Kotlin use navigation-ui-ktx

    implementation 'org.apache.commons:commons-text:1.6'

    implementation 'org.greenrobot:eventbus:3.2.0'

    implementation "androidx.tonyodev.fetch2:xfetch2:3.1.4"

    implementation 'com.android.support:multidex:1.0.3'

    implementation 'com.github.caiyonglong:musicapi:1.0.6'

    implementation 'com.github.slashrootv200:retrofit-html-converter:0.0.2'

    implementation 'com.github.mkaflowski:Media-Style-Palette:1.3'

    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation 'androidx.palette:palette:1.0.0'
}
